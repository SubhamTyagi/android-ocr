androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
room-runtime={module="androidx.room:room-runtime",version.ref="room"}
room-ktx={module="androidx.room:room-ktx",version.ref="room"}
room-compiler={module="androidx.room:room-compiler",version.ref="room"}

cropper={module="com.vanniktech:android-image-cropper",version.ref="cropper"}
coil={module="io.coil-kt:coil-compose",version.ref="coil"}

tess-ocr={module="cz.adaptech.tesseract4android:tesseract4android-openmp",version.ref="ocr"}

kotlinx-coroutines-android={module="org.jetbrains.kotlin:kotlinx-coroutines-android",version.ref="kotlinx-coroutines"}
androidx-material3 = { module = "androidx.compose.material3:material3" }

hilt-android={module="com.google.dagger:hilt-android",version.ref="hilt"}
hilt-compiler={module="com.google.dagger:hilt-android-compiler",version.ref="hilt"}

hilt-androidx-compiler={module="androidx.hilt:hilt-compiler",version.ref= "hiltX" }

hilt-lifecycle-viewmodel={module="androidx.hilt:hilt-lifecycle-viewmodel",version.ref= "hiltX" }

hilt-nav-compose={module="androidx.hilt:hilt-navigation-compose",version.ref="hiltX"}


junit = { module = "junit:junit", version.ref = "junit" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigationCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android={ id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp-dev={ id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization={id ="org.jetbrains.kotlin.plugin.serialization",version.ref="kotlinSerialization"}


